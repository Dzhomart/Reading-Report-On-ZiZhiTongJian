<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="资治通鉴读书笔记详情">
  <title>笔记详情 - 资治通鉴读书笔记</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="index.html" class="logo">资治通鉴</a>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">首页</a></li>
          <li><a href="list.html" class="nav-link">笔记列表</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="detail-page">
    <div id="note-detail-container" class="detail-container">
      <div class="back-button-container">
        <a href="list.html" id="back-link" class="ancient-back-btn">
          <span class="back-arrow">←</span>
          <span class="back-text">返回书卷</span>
        </a>
      </div>

      <article class="ancient-scroll">
        <header class="scroll-header">
          <div class="scroll-ornament top"></div>
          
          <div class="scroll-content">
            <div class="dynasty-badge" id="note-dynasty"></div>
            <h1 class="scroll-title" id="note-title"></h1>
            <div class="scroll-meta">
              <span class="meta-date" id="note-date"></span>
              <span class="meta-category" id="note-category"></span>
            </div>
          </div>
          
          <div class="scroll-ornament bottom"></div>
        </header>

        <div class="scroll-body">
          <div class="original-text-scroll" id="original-text-section">
            <div class="scroll-label">原文摘录</div>
            <div class="vertical-text" id="original-text-content"></div>
          </div>

          <div class="insight-section" id="note-content">
            <div class="insight-label">读史心得</div>
          </div>

          <div class="scroll-tags" id="scroll-tags">
            <span class="tags-label">标签</span>
            <div class="tags-container" id="tags-container"></div>
          </div>
        </div>
      </article>

      <section class="related-scrolls" id="related-section" style="display: none;">
        <h2 class="related-title">延伸阅读</h2>
        <div class="related-grid" id="related-notes"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer-content">
        资治通鉴读书笔记 · 传承经典智慧<br>
        努尔依亚
      </p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
