<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="资治通鉴读书笔记 - 品味古典史学之美">
  <title>资治通鉴读书笔记 - 品味古典史学之美</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="index.html" class="logo">资治通鉴</a>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">首页</a></li>
          <li><a href="list.html" class="nav-link">笔记列表</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="golden-quotes">
      <div class="quotes-container">
        <div class="quotes-track" id="quotes-track"></div>
      </div>
    </section>
    
    <section class="hero">
      <div class="container">
        <h1 class="hero-title">资治通鉴读书笔记</h1>
        <p class="hero-subtitle">以史为鉴，可以知兴替。品味司马光史学巨著，探索千年历史智慧</p>
        <div class="hero-decoration"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2 class="section-title">阅读足迹</h2>
        <div class="reading-footprint">
          <div class="footprint-header">
            <div class="footprint-info" id="footprint-info"></div>
            <div class="footprint-legend">
              <span class="legend-label">无笔记</span>
              <div class="legend-scale">
                <div class="legend-box" style="background-color: #F5F0E6;"></div>
                <div class="legend-box" style="background-color: #D4A84B;"></div>
                <div class="legend-box" style="background-color: #B8860B;"></div>
                <div class="legend-box" style="background-color: #8B6914;"></div>
              </div>
              <span class="legend-label">有笔记</span>
            </div>
          </div>
          <div class="calendar-heatmap" id="calendar-heatmap"></div>
          <div class="calendar-months" id="calendar-months"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2 class="section-title">读书笔记</h2>
        <div class="ancient-shelf" id="notes-shelf"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer-content">
        资治通鉴读书笔记 · 传承经典智慧<br>
        努尔依亚
      </p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
