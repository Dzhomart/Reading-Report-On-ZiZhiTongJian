<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="资治通鉴笔记列表 - 浏览所有读书笔记">
  <title>笔记列表 - 资治通鉴读书笔记</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="index.html" class="logo">资治通鉴</a>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">首页</a></li>
          <li><a href="list.html" class="nav-link">笔记列表</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="filter-section">
      <div class="container">
        <div class="filter-container">
          <span class="filter-label">筛选朝代：</span>
          <button class="filter-btn active" data-dynasty="all">全部</button>
          <button class="filter-btn" data-dynasty="秦纪">秦纪</button>
          <button class="filter-btn" data-dynasty="汉纪">汉纪</button>
          <button class="filter-btn" data-dynasty="晋纪">晋纪</button>
          <button class="filter-btn" data-dynasty="唐纪">唐纪</button>
          <button class="filter-btn" data-dynasty="宋纪">宋纪</button>
          <button class="filter-btn" data-dynasty="明纪">明纪</button>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="tags-section">
          <h3 class="tags-title">标签筛选</h3>
          <div class="tags-container" id="tags-container">
            <button class="tag-stamp active" data-tag="all">全部</button>
            <button class="tag-stamp" data-tag="权谋">权谋</button>
            <button class="tag-stamp" data-tag="兴衰">兴衰</button>
            <button class="tag-stamp" data-tag="用人">用人</button>
          </div>
        </div>
        
        <h2 class="section-title small">全部笔记</h2>
        <div class="breadcrumb" id="breadcrumb">
          <a href="index.html">首页</a>
          <span>/</span>
          <span>笔记列表</span>
        </div>
        
        <div class="notes-grid" id="notes-list"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer-content">
        资治通鉴读书笔记 · 传承经典智慧<br>
        努尔依亚
      </p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/list.js"></script>
</body>
</html>
